<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>danilArt - Koleksiyonum</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; padding: 40px 20px; }
        .ust-bar { max-width: 1200px; margin: 0 auto 40px auto; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.6); padding: 20px 30px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
        .ust-bar h2 { font-size: 1.5rem; font-weight: 800; color: #00f2fe; }
        .bakiye-box { background: linear-gradient(45deg, #00f2fe, #4facfe); color: #0b0f19; padding: 8px 16px; border-radius: 20px; font-weight: 700; }
        .nav-btn { background: transparent; border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 8px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.05); color: #fff; border-color: #fff; }
        
        .vitrin { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .eser-kart { background: #0f172a; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; }
        .eser-resim { height: 250px; background-size: cover; background-position: center; background-color: #1e293b; }
        .eser-detay { padding: 20px; }
        .eser-detay h3 { font-size: 1.2rem; margin-bottom: 5px; color: #fff; }
        .eser-detay p { color: #64748b; font-size: 0.85rem; margin-bottom: 15px; }
        .kart-alt { display: flex; justify-content: space-between; align-items: center; }
        .fiyat { font-weight: 700; color: #ff3366; }
        
        .btn-gerisat { background: transparent; border: 1px solid #ff3366; color: #ff3366; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-gerisat:hover { background: #ff3366; color: #fff; }
    </style>
</head>
<body>

    <div class="ust-bar">
        <h2>Koleksiyonun</h2>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="bakiye-box" id="bakiyeGosterge">Bakiye: Yükleniyor...</div>
            <a href="panel.html" class="nav-btn">Mağazaya Dön</a>
        </div>
    </div>

    <div class="vitrin" id="koleksiyonGrid">
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAP9eeyE2up41WHKAU7KFvpOTSzbaPCVtU",
            authDomain: "danilart.firebaseapp.com",
            projectId: "danilart",
            storageBucket: "danilart.firebasestorage.app",
            messagingSenderId: "1074284541500",
            appId: "1:1074284541500:web:1e38ff7c8d69d45efd3539",
            measurementId: "G-HHVPZV9RYG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urunHavuzu = {
            'arch01': { baslik: 'ARCH_01', fiyat: 40 },
            'vamp': { baslik: 'VAMP_JACKET', fiyat: 60 },
            'boots': { baslik: 'SABER_BOOTS', fields: 30 },
            'hoodie': { baslik: 'DARK_HOODIE', fiyat: 50 }
        };

        let mevcutBakiye = 0;
        let alinanlarListesi = [];
        let uid = "";

        const grid = document.getElementById('koleksiyonGrid');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                uid = user.uid;
                const userDoc = doc(db, "kullanicilar", uid);
                
                getDoc(userDoc).then((snapshot) => {
                    if (snapshot.exists()) {
                        const veri = snapshot.data();
                        mevcutBakiye = veri.bakiye;
                        alinanlarListesi = veri.alinanlar || [];

                        document.getElementById('bakiyeGosterge').innerText = "Bakiye: " + mevcutBakiye + " Puan";
                        koleksiyonuListele();
                    }
                });
            } else {
                window.location.href = 'giris.html';
            }
        });

        function koleksiyonuListele() {
            grid.innerHTML = "";
            if (alinanlarListesi.length === 0) {
                grid.innerHTML = '<p style="color: #64748b;">Koleksiyonunda henüz eser yok abi.</p>';
                return;
            }

            alinanlarListesi.forEach(id => {
                const urun = urunHavuzu[id];
                if (urun) {
                    const kartHtml = `
                        <div class="eser-kart" id="koleksiyon-${id}">
                            <div class="eser-resim" style="background-image: url('13295.jpg')"></div>
                            <div class="eser-detay">
                                <h3>${urun.baslik}</h3>
                                <p>Tasarımcı: @danil</p>
                                <div class="kart-alt">
                                    <span class="fiyat">+${urun.fiyat || 30} Puan</span>
                                    <button class="btn-gerisat" data-id="${id}" data-fiyat="${urun.fiyat || 30}">Geri Sat</button>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += kartHtml;
                }
            });

            document.querySelectorAll('.btn-gerisat').forEach(buton => {
                buton.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const fiyat = parseInt(e.target.getAttribute('data-fiyat'));
                    geriSatIslemi(id, fiyat);
                });
            });
        }

        function geriSatIslemi(id, fiyat) {
            const yeniBakiye = mevcutBakiye + fiyat;
            const yeniAlinanlar = alinanlarListesi.filter(item => item !== id);
            const userDoc = doc(db, "kullanicilar", uid);

            updateDoc(userDoc, {
                bakiye: yeniBakiye,
                alinanlar: yeniAlinanlar
            }).then(() => {
                alert('Eser satıldı, puan veri tabanında güncellendi.');
                window.location.reload();
            });
        }
    </script>
</body>
</html>
